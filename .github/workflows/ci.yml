name: CI

on:
  push:
    branches: [main, next, rewrite/v2]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Warnings-as-errors is set in Directory.Build.props, so a warning fails this step.
      - name: Build server
        run: dotnet build server/GSCode.slnx --nologo

      # Corpus/stock-fixture test categories auto-skip when their local data is absent.
      - name: Test server
        # Corpus tests need a local mod-tools install (%TA_TOOLS_PATH%\shareaw), which CI
        # does not have. They no-op without it, but excluding them keeps that explicit.
        run: dotnet test server/GSCode.slnx --nologo --no-build --filter "Category!=Corpus"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Compile client
        run: npm run compile
        working-directory: client
