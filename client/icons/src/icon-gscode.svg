<!-- Marketplace / extension icon. 42-unit canvas = the 26-unit mark plus its
     clearspace (8 units, the chamfer width) on all four sides. Background stays
     transparent; the mark carries the identity on its own. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" width="42" height="42">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0.62" y2="0.79">
      <stop offset="0" stop-color="#7BEFDD"/>
      <stop offset="0.58" stop-color="#3ED1BD"/>
      <stop offset="1" stop-color="#8B7BFF"/>
    </linearGradient>
  </defs>
  <g transform="translate(8 8)">
    <path fill="url(#rim)" d="M8 0 H26 V11.44 H0 V8 Z M0 14.56 H26 V18 L18 26 H0 Z"/>
  </g>
</svg>
